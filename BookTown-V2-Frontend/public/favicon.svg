<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131822"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="pageL" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9EC6E9"/>
      <stop offset="100%" stop-color="#6A99C8"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7AA3D6"/>
      <stop offset="100%" stop-color="#4E7DAD"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0D082"/>
      <stop offset="100%" stop-color="#D4A030"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Subtle top-edge specular -->
  <rect x="4" y="1" width="24" height="1.2" rx="0.6" fill="rgba(255,255,255,0.09)"/>

  <!-- Left page -->
  <rect x="5" y="7.5" width="10" height="16" rx="0.8" fill="url(#pageL)" opacity="0.92"/>

  <!-- Right page -->
  <rect x="17" y="7.5" width="10" height="16" rx="0.8" fill="url(#pageR)" opacity="0.88"/>

  <!-- Left page lines -->
  <line x1="7.5" y1="11"   x2="13.5" y2="11"   stroke="rgba(255,255,255,0.42)" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="7.5" y1="13"   x2="13.5" y2="13"   stroke="rgba(255,255,255,0.32)" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="7.5" y1="15"   x2="13.5" y2="15"   stroke="rgba(255,255,255,0.26)" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="7.5" y1="17"   x2="13.5" y2="17"   stroke="rgba(255,255,255,0.22)" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="7.5" y1="19"   x2="11"   y2="19"   stroke="rgba(255,255,255,0.16)" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Right page lines -->
  <line x1="18.5" y1="11"  x2="24.5" y2="11"   stroke="rgba(255,255,255,0.30)" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="18.5" y1="13"  x2="24.5" y2="13"   stroke="rgba(255,255,255,0.22)" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="18.5" y1="15"  x2="24.5" y2="15"   stroke="rgba(255,255,255,0.18)" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="18.5" y1="17"  x2="24.5" y2="17"   stroke="rgba(255,255,255,0.15)" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Spine shadow -->
  <rect x="14.5" y="7.5" width="3" height="16" fill="rgba(7,10,15,0.75)"/>

  <!-- Gold accent dot (glow) -->
  <circle cx="16" cy="9" r="3.5" fill="rgba(232,184,111,0.22)" filter="url(#glow)"/>
  <!-- Gold dot solid -->
  <circle cx="16" cy="9" r="1.8" fill="url(#gold)"/>
  <!-- Highlight on dot -->
  <ellipse cx="15.3" cy="8.3" rx="0.7" ry="0.5" fill="rgba(255,240,190,0.65)"/>
</svg>
