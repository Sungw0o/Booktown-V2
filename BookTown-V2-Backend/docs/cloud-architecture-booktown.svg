<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020">
  <defs>
    <style>
      .title { font: 800 48px Arial, "Malgun Gothic", sans-serif; fill: #111827; }
      .label { font: 700 16px Arial, "Malgun Gothic", sans-serif; fill: #111827; }
      .small { font: 600 12px Arial, "Malgun Gothic", sans-serif; fill: #374151; }
      .tiny { font: 600 10px Arial, "Malgun Gothic", sans-serif; fill: #475569; }
      .port { font: 800 11px Arial, sans-serif; fill: #111827; }
      .aws-label { font: 700 12px Arial, sans-serif; fill: #111827; }
      .box { fill: #fbfaf6; stroke: #374151; stroke-width: 1.6; }
      .region { fill: #f8fffb; stroke: #86efac; stroke-width: 1.2; stroke-dasharray: 4 4; }
      .vpc { fill: #f7f4ff; stroke: #a78bfa; stroke-width: 1.5; }
      .az { fill: #ffffff; stroke: #c4b5fd; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .public { fill: #f7fee7; stroke: #d9f99d; stroke-width: 1.1; }
      .private { fill: #ecfeff; stroke: #a5f3fc; stroke-width: 1.1; }
      .container { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
      .line-dashed { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .icon-text { font: 800 13px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .icon-text-dark { font: 800 13px Arial, sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#f4d35e"/>
      <stop offset="1" stop-color="#e9c64f"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="1020" fill="#ffffff"/>
  <circle cx="1315" cy="125" r="138" fill="url(#gold)" opacity="0.85"/>
  <circle cx="1395" cy="150" r="85" fill="#fff7d6" opacity="0.9"/>

  <text x="54" y="86" class="title">2. 클라우드 아키텍처</text>

  <!-- actors -->
  <g transform="translate(186,132)">
    <circle cx="0" cy="0" r="17" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
    <path d="M-25 45c6-28 44-28 50 0" fill="none" stroke="#60a5fa" stroke-width="3"/>
    <text x="-33" y="66" class="tiny">developer</text>
  </g>
  <g transform="translate(650,132)">
    <circle cx="0" cy="0" r="17" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
    <path d="M-25 45c6-28 44-28 50 0" fill="none" stroke="#60a5fa" stroke-width="3"/>
    <text x="-18" y="66" class="tiny">client</text>
  </g>

  <!-- AWS cloud frame -->
  <rect x="46" y="220" width="1330" height="720" class="box"/>
  <rect x="50" y="224" width="18" height="18" rx="2" fill="#111827"/>
  <text x="74" y="238" class="aws-label">AWS Cloud</text>

  <!-- top global edge -->
  <g id="edge">
    <rect x="720" y="236" width="56" height="56" rx="7" fill="#ef4444"/>
    <text x="748" y="264" class="icon-text">WAF</text>
    <rect x="720" y="318" width="56" height="56" rx="7" fill="#7c3aed"/>
    <text x="748" y="346" class="icon-text">R53</text>
    <text x="787" y="346" class="small">www.booktown.shop</text>
    <text x="787" y="363" class="small">api.booktown.shop</text>
    <rect x="720" y="400" width="56" height="56" rx="7" fill="#6366f1"/>
    <text x="748" y="428" class="icon-text">CF</text>
    <rect x="1088" y="575" width="68" height="68" rx="8" fill="#dc2626"/>
    <text x="1122" y="604" class="icon-text">ACM</text>
    <text x="1122" y="622" class="icon-text">TLS</text>
  </g>

  <!-- frontend S3 -->
  <g>
    <rect x="278" y="365" width="76" height="58" rx="8" fill="#84a942"/>
    <path d="M300 383h32v24h-32z" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="316" y="398" class="icon-text">S3</text>
    <text x="262" y="448" class="label">Frontend Static Hosting</text>
    <text x="276" y="468" class="small">React 19 + Vite build assets</text>
  </g>

  <!-- CI/CD -->
  <g>
    <rect x="94" y="320" width="92" height="74" rx="10" fill="#111827"/>
    <text x="140" y="351" class="icon-text">GitHub</text>
    <text x="140" y="371" class="icon-text">Actions</text>
    <rect x="94" y="450" width="92" height="74" rx="10" fill="#0f172a"/>
    <text x="140" y="480" class="icon-text">GHCR</text>
    <text x="140" y="500" class="icon-text">Image</text>
  </g>

