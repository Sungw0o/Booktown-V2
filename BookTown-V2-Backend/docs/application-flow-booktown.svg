<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1680" viewBox="0 0 1280 1680">
  <defs>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #111827; }
      .section-title { font: 700 18px Arial, sans-serif; fill: #111827; }
      .label { font: 600 15px Arial, sans-serif; fill: #111827; }
      .small { font: 500 12px Arial, sans-serif; fill: #374151; }
      .port { font: 700 11px Arial, sans-serif; fill: #111827; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; }
      .subbox { fill: #eef2f7; stroke: #cbd5e1; stroke-width: 1.2; }
      .dashed { fill: none; stroke: #64748b; stroke-width: 1.3; stroke-dasharray: 5 4; }
      .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #64748b; stroke-width: 1.7; marker-end: url(#arrow); }
      .aws { fill: #111827; font: 700 12px Arial, sans-serif; }
      .icon-text { font: 700 13px Arial, sans-serif; fill: #ffffff; }
      .service-text { font: 700 14px Arial, sans-serif; fill: #111827; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
  </defs>

  <rect width="1280" height="1680" fill="#ffffff" />
  <text x="62" y="76" class="title">3. Application Flow</text>

  <!-- Simple reusable icon shapes are drawn inline to keep this document self-contained. -->

