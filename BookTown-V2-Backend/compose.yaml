services:
  chroma:
    image: 'chromadb/chroma:latest'
    ports:
      - '8000:8000'
  mongodb:
    image: 'mongo:latest'
    environment:
      - 'MONGO_INITDB_DATABASE=booktown'
      - 'MONGO_INITDB_ROOT_PASSWORD=booktown'
      - 'MONGO_INITDB_ROOT_USERNAME=booktown'
    ports:
      - '27017:27017'
  mysql:
    image: 'mysql:latest'
    environment:
      - 'MYSQL_DATABASE=booktown'
      - 'MYSQL_PASSWORD=booktown'
      - 'MYSQL_ROOT_PASSWORD=booktown-root'
      - 'MYSQL_USER=booktown'
    ports:
      - '3306:3306'
  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'
