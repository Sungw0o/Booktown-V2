# 부하 테스트(perf/RUNBOOK-transaction-boundary.md) 전용 프로파일.
# local/prod 프로파일 동작에는 영향을 주지 않는다. 반드시 local,perf 조합으로만 사용한다.
booktown:
  summary:
    daily-rate-limit: ${PERF_DAILY_RATE_LIMIT:100000}   # rate limit 사실상 해제
  perf:
    fake-ai-latency-ms: ${PERF_FAKE_AI_LATENCY_MS:8000} # AI 응답 지연을 고정값으로 재현

logging:
  level:
    com.zaxxer.hikari: DEBUG
