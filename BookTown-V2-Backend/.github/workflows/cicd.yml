name: CI/CD

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'EC2 배포 실행 여부'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

# 워크플로우 기본 최소 권한 — CD job만 packages: write 승격
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: booktown/booktown-backend-v2

jobs:
  ci:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 테스트 실행
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Docker 이미지 빌드 (smoke check)
        if: github.event_name == 'pull_request'
        run: docker build -t booktown-backend:ci-check .

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 테스트 및 커버리지 리포트 생성
        run: ./gradlew test jacocoTestReport --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: SonarCloud 분석
        if: env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.sources=src/main/java
            -Dsonar.tests=src/test/java
            -Dsonar.java.binaries=build/classes/java/main
            -Dsonar.junit.reportPaths=build/test-results/test
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

      - name: SonarCloud 미설정 안내
        if: env.SONAR_TOKEN == '' || env.SONAR_PROJECT_KEY == '' || env.SONAR_ORGANIZATION == ''
        run: |
          echo "SONAR_TOKEN secret, SONAR_PROJECT_KEY variable, SONAR_ORGANIZATION variable 설정 후 SonarCloud 분석이 실행됩니다."

  cd:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [ci, sonar]
    if: ((github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master') && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker 메타데이터 추출
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: EC2 운영 파일 동기화
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "compose.prod.yaml,monitoring,scripts,ops"
          target: "/tmp/booktown-deploy"
          rm: true

      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -euo pipefail
            cd /opt/booktown

            echo "운영 파일 동기화 중..."
            sudo cp /tmp/booktown-deploy/compose.prod.yaml /opt/booktown/compose.prod.yaml
            sudo rm -rf /opt/booktown/monitoring /opt/booktown/scripts
            sudo cp -R /tmp/booktown-deploy/monitoring /opt/booktown/monitoring
            sudo cp -R /tmp/booktown-deploy/scripts /opt/booktown/scripts
            sudo rm -rf /opt/booktown/ops
            sudo cp -R /tmp/booktown-deploy/ops /opt/booktown/ops
            sudo chmod +x /opt/booktown/scripts/*.sh
            sudo mkdir -p /opt/booktown/backups/mysql

            echo "필수 환경변수 확인 중..."
            for key in MYSQL_PASSWORD MYSQL_ROOT_PASSWORD MONGO_PASSWORD REDIS_PASSWORD GRAFANA_ADMIN_PASSWORD; do
              if ! sudo grep -q "^$key=" /opt/booktown/.env; then
                echo "❌ /opt/booktown/.env에 $key 값이 필요합니다."
                exit 1
              fi
            done

            NEW_TAG="${{ steps.meta.outputs.version }}"
            PREVIOUS_IMAGE=$(sudo docker compose -f compose.prod.yaml ps -q backend \
              | xargs -r sudo docker inspect --format='{{.Config.Image}}' 2>/dev/null || true)
            if [ -z "$PREVIOUS_IMAGE" ]; then
              PREVIOUS_IMAGE="none"
            fi

            echo "이전 이미지: $PREVIOUS_IMAGE"
            echo "새 이미지 태그: $NEW_TAG"

            echo "새 이미지 풀링 중..."
            sudo env IMAGE_TAG="$NEW_TAG" docker compose -f compose.prod.yaml pull

            echo "컨테이너 교체 및 운영 스택 기동 중..."
            sudo env IMAGE_TAG="$NEW_TAG" docker compose -f compose.prod.yaml up -d

            echo "Readiness 확인 중..."
            RETRIES=12
            INTERVAL=10
            for i in $(seq 1 $RETRIES); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.booktown.shop/api/v1/health/readiness || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ Readiness 확인 성공 (시도 $i)"
                break
              fi
              if [ "$i" = "$RETRIES" ]; then
                echo "❌ Readiness 확인 실패 — 롤백 시작"
                if [ "$PREVIOUS_IMAGE" != "none" ]; then
                  PREVIOUS_TAG="${PREVIOUS_IMAGE##*:}"
                  sudo env IMAGE_TAG="$PREVIOUS_TAG" docker compose -f compose.prod.yaml up -d --no-deps backend
                fi
                exit 1
              fi
              echo "시도 $i/$RETRIES 실패 (HTTP $STATUS), ${INTERVAL}초 후 재시도..."
              sleep $INTERVAL
            done

            echo "🧹 오래된 이미지 정리 중..."
            sudo docker image prune -f
