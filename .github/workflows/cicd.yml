name: CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'EC2 배포 실행 여부'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: sungw0o/booktown-backend-v2
  NODE_VERSION: '24'

# ───────────────────────────────────────────────────────────
# BACKEND
# ───────────────────────────────────────────────────────────
jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflow: ${{ steps.filter.outputs.workflow }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - id: filter
        name: 변경 영역 감지
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "backend=true"
              echo "frontend=true"
              echo "workflow=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              RANGE="HEAD^...HEAD"
            else
              RANGE="$BASE...$HEAD"
            fi
          fi

          backend=false
          frontend=false
          workflow=false

          while IFS= read -r file; do
            case "$file" in
              BookTown-V2-Backend/*)
                backend=true
                ;;
              BookTown-V2-Frontend/*)
                frontend=true
                ;;
              .github/workflows/*|.github/dependabot.yml)
                workflow=true
                ;;
            esac
          done < <(git diff --name-only "$RANGE")

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "workflow=$workflow"
          } >> "$GITHUB_OUTPUT"

  backend-ci:
    name: Backend / Test + SonarCloud
    runs-on: ubuntu-latest
    needs: detect-changes
    timeout-minutes: 20
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflow == 'true'
    defaults:
      run:
        working-directory: BookTown-V2-Backend
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      - name: 테스트 및 커버리지 리포트 생성
        run: ./gradlew test jacocoTestReport --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Buildx 설정 (PR smoke check)
        if: github.event_name == 'pull_request' && needs.detect-changes.outputs.backend == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Docker 이미지 빌드 (smoke check)
        if: github.event_name == 'pull_request' && needs.detect-changes.outputs.backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./BookTown-V2-Backend
          push: false
          load: false
          tags: booktown-backend:ci-check
          cache-from: type=gha,scope=backend-smoke
          cache-to: type=gha,mode=max,scope=backend-smoke

      - name: SonarCloud 분석
        if: |
          env.SONAR_TOKEN != '' &&
          env.SONAR_PROJECT_KEY != '' &&
          env.SONAR_ORGANIZATION != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        with:
          projectBaseDir: BookTown-V2-Backend
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.sources=src/main/java
            -Dsonar.tests=src/test/java
            -Dsonar.java.binaries=build/classes/java/main
            -Dsonar.junit.reportPaths=build/test-results/test
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: SonarCloud 미설정 안내
        if: env.SONAR_TOKEN == '' || env.SONAR_PROJECT_KEY == '' || env.SONAR_ORGANIZATION == ''
        run: echo "SONAR_TOKEN, SONAR_PROJECT_KEY, SONAR_ORGANIZATION 설정 후 SonarCloud 분석이 실행됩니다."

  backend-local-ops:
    name: Backend / Local Ops Config
    runs-on: ubuntu-latest
    needs: detect-changes
    timeout-minutes: 10
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflow == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Compose 설정 검증
        run: docker compose -f BookTown-V2-Backend/compose.yaml --profile app --profile monitoring config --quiet

      - name: Prometheus 설정 검증
        run: |
          docker run --rm \
            -v "$PWD/BookTown-V2-Backend/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v2.55.1 \
            check config /etc/prometheus/prometheus.yml

      - name: k6 스크립트 검증
        run: |
          docker run --rm \
            -v "$PWD/BookTown-V2-Backend/performance/k6:/scripts:ro" \
            grafana/k6:0.54.0 \
            inspect /scripts/health-check.js

  backend-cd:
    name: Backend / Deploy
    runs-on: ubuntu-latest
    needs: [detect-changes, backend-ci, backend-local-ops]
    if: |
      (needs.detect-changes.outputs.backend == 'true' &&
        github.event_name == 'push' &&
        (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    timeout-minutes: 30
    concurrency:
      group: backend-deploy-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: Docker 메타데이터 추출
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v7
        with:
          context: ./BookTown-V2-Backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: EC2 운영 파일 동기화
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "BookTown-V2-Backend/compose.prod.yaml,BookTown-V2-Backend/monitoring,BookTown-V2-Backend/scripts,BookTown-V2-Backend/ops"
          target: "/tmp/booktown-deploy"
          strip_components: 1
          rm: true

      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -euo pipefail
            cd /opt/booktown

            echo "운영 파일 동기화 중..."
            sudo cp /tmp/booktown-deploy/compose.prod.yaml /opt/booktown/compose.prod.yaml
            sudo rm -rf /opt/booktown/monitoring /opt/booktown/scripts
            sudo cp -R /tmp/booktown-deploy/monitoring /opt/booktown/monitoring
            sudo cp -R /tmp/booktown-deploy/scripts /opt/booktown/scripts
            sudo rm -rf /opt/booktown/ops
            sudo cp -R /tmp/booktown-deploy/ops /opt/booktown/ops
            sudo chmod +x /opt/booktown/scripts/*.sh
            sudo mkdir -p /opt/booktown/backups/mysql

            echo "필수 환경변수 확인 중..."
            for key in MYSQL_PASSWORD MYSQL_ROOT_PASSWORD MONGO_PASSWORD REDIS_PASSWORD GRAFANA_ADMIN_PASSWORD; do
              if ! sudo grep -q "^$key=" /opt/booktown/.env; then
                echo "❌ /opt/booktown/.env에 $key 값이 필요합니다."
                exit 1
              fi
            done

            NEW_TAG="${{ steps.meta.outputs.version }}"
            PREVIOUS_IMAGE=$(sudo docker compose -f compose.prod.yaml ps -q backend \
              | xargs -r sudo docker inspect --format='{{.Config.Image}}' 2>/dev/null || true)
            if [ -z "$PREVIOUS_IMAGE" ]; then
              PREVIOUS_IMAGE="none"
            fi

            echo "이전 이미지: $PREVIOUS_IMAGE"
            echo "새 이미지 태그: $NEW_TAG"

            echo "새 이미지 풀링 중..."
            sudo env IMAGE_TAG="$NEW_TAG" docker compose -f compose.prod.yaml pull

            echo "컨테이너 교체 및 운영 스택 기동 중..."
            sudo env IMAGE_TAG="$NEW_TAG" docker compose -f compose.prod.yaml up -d

            echo "Readiness 확인 중..."
            RETRIES=12
            INTERVAL=10
            for i in $(seq 1 $RETRIES); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.booktown.shop/api/v1/health/readiness || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ Readiness 확인 성공 (시도 $i)"
                break
              fi
              if [ "$i" = "$RETRIES" ]; then
                echo "❌ Readiness 확인 실패 — 롤백 시작"
                sudo docker compose -f compose.prod.yaml logs --tail=120 backend || true
                if [ "$PREVIOUS_IMAGE" != "none" ]; then
                  cat > /tmp/booktown-rollback.yaml <<EOF
            services:
              backend:
                image: $PREVIOUS_IMAGE
            EOF
                  sudo docker compose -f compose.prod.yaml -f /tmp/booktown-rollback.yaml up -d --no-deps backend
                fi
                exit 1
              fi
              echo "시도 $i/$RETRIES 실패 (HTTP $STATUS), ${INTERVAL}초 후 재시도..."
              sleep $INTERVAL
            done

            echo "🧹 오래된 이미지 정리 중..."
            sudo docker image prune -f

# ───────────────────────────────────────────────────────────
# FRONTEND
# ───────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend / Build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.workflow == 'true'
    defaults:
      run:
        working-directory: BookTown-V2-Frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: BookTown-V2-Frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: 빌드
        run: npm run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - name: 빌드 결과물 업로드 (CD 단계용)
        if: |
          (github.ref == 'refs/heads/dev' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: BookTown-V2-Frontend/dist/
          retention-days: 1

  frontend-cd:
    name: Frontend / Deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend-ci]
    if: |
      ((needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.workflow == 'true') &&
        github.ref == 'refs/heads/dev' &&
        github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    concurrency:
      group: frontend-deploy-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/

      - name: AWS 자격증명 설정 (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: S3 동기화 — HTML (캐시 없음)
        run: |
          CLEAN_BUCKET=$(echo "${{ vars.S3_BUCKET }}" | tr -d '\r\n[:space:]')
          aws s3 sync dist/ s3://$CLEAN_BUCKET \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --delete

      - name: S3 동기화 — 정적 자산 (장기 캐시)
        run: |
          CLEAN_BUCKET=$(echo "${{ vars.S3_BUCKET }}" | tr -d '\r\n[:space:]')
          aws s3 sync dist/ s3://$CLEAN_BUCKET \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: CloudFront 캐시 무효화
        run: |
          CLEAN_DIST_ID=$(echo "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" | tr -d '\r\n[:space:]')
          aws cloudfront create-invalidation \
            --distribution-id "$CLEAN_DIST_ID" \
            --paths "/index.html" "/" "/favicon.ico" "/favicon.png" "/apple-touch-icon.png" "/favicon.svg"

      - run: echo "✅ 배포 완료 → https://www.booktown.shop"
